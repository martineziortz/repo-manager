# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# !!!!!!!!!!!!!!!!!!!!!! DO NOT EDIT THIS FILE !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
#
# Any changes you make to this file **will be lost**.
#
# Place all project specific changes into a `.lando.yml` file
# Place all personal changes into a `.lando.local.yml` file
#
# This file is the default configuration for Lando shared across every project.
# It is managed automatically by an external system.
#
# If you need to change the default Lando behavior for our projects, then you
# must edit this file:
# https://github.com/dbd-net/misc-repo-manager/blob/develop/packages/lando-laravel/files/lando.dist.yml

name: laravel-lando
recipe: laravel
config:
  php: '8.1'
  webroot: ./public/
  via: nginx
  database: mysql:8.0
  cache: redis
env_file:
  - .lando/composer-auth.env
services:
  appserver:
    build:
      - composer config -g repo.dbdnet composer 'https://dbdnet.repo.repman.io'
      - composer config -g repo.nova composer 'https://nova.laravel.com'
    build_as_root:
      - apt-get update && apt-get install -y ca-certificates curl gnupg
      - mkdir -p /etc/apt/keyrings
      - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_18.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
      - apt-get update && apt-get install -y nodejs libgmp-dev re2c libmhash-dev libmcrypt-dev file
      - ln -s /usr/include/x86_64-linux-gnu/gmp.h /usr/local/include/
      - docker-php-ext-configure gmp
      - docker-php-ext-install gmp

    overrides:
      environment:
        APP_ENV: local
        DB_HOST: database
        DB_PORT: 3306
        DB_DATABASE: laravel
        DB_USERNAME: laravel
        DB_PASSWORD: laravel
        REDIS_HOST: cache
        REDIS_PASSWORD: null
        REDIS_PORT: 6379
  database:
    run_as_root:
      - "mysql -uroot -e \"CREATE DATABASE IF NOT EXISTS testing; GRANT ALL PRIVILEGES ON testing.* TO 'laravel'@'%';\""
tooling:
  phpunit:
    service: appserver
    cmd: vendor/bin/phpunit
  node:
    service: appserver
  npm:
    service: appserver
  npx:
    service: appserver
