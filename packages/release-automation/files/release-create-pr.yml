name: Create release pull request

on:
  push:
    branches:
      - develop

jobs:
  check_for_automation:
    name: Check if automated
    runs-on: ubuntu-latest
    outputs:
      automated_commit: ${{ steps.build_commit.outputs.skip == true || steps.dependabot_commit.outputs.skip == true || steps.actions_commit.outputs.skip == true }}
    steps:
      - name: Is commit automated
        id: build_commit
        if: startsWith(github.event.head_commit.message, '[BUILD]')
        run: echo "skip=1" >> "$GITHUB_OUTPUT"

      - name: Is dependabot commit
        id: dependabot_commit
        if: github.event.head_commit.author.username == 'dependabot[bot]'
        run: echo "skip=1" >> "$GITHUB_OUTPUT"

      - name: Is github-actions commit
        id: actions_commit
        if: github.event.head_commit.author.username == 'github-actions[bot]'
        run: echo "skip=1" >> "$GITHUB_OUTPUT"

  create_pull_request:
    name: Create release PR
    runs-on: ubuntu-latest
    if: needs.check_for_automation.outputs.automated_commit == 'false'
    needs:
      - check_for_automation
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check for existing pull request
        id: find-pull-request
        uses: juliangruber/find-pull-request-action@v1
        with:
          base: main
          branch: develop

      - name: Create pull request
        if: steps.find-pull-request.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create -B main -H develop --title '[BUILD] Merge develop to main' --body 'Automated release merge'
