name: hashfiles
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
      - name: hashing
        run: |
          echo 'hashFiles ${{ hashFiles('./tasks/sonarcloud/sonarcloud.properties') }}'
          echo "shasum "`shasum './tasks/sonarcloud/sonarcloud.properties'`