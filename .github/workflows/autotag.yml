name: Automatically tag repositories
concurrency:
  group: autotag
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.REPO_PUSH_PAT }}
  REPO_LIMIT: 50

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'
  push:
    paths:
      - 'tasks/autotag/*'
    branches:
      - develop

jobs:
  get-repos:
    name: Get the list of repos to update
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.set-repo-list.outputs.REPO_LIST }}

    steps:
      - uses: actions/checkout@v3
      - name: Get repostiory list
        id: set-repo-list
        run: |
          echo "REPO_LIST=$(./bin/get-repos.sh | jq -cM '. | keys')" >> "$GITHUB_OUTPUT"

  autotag:
    name: Tagging ${{ matrix.repository }}
    runs-on: ubuntu-latest
    needs:
      - get-repos
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        repository: ${{ fromJson(needs.get-repos.outputs.repos) }}

    steps:
      - uses: actions/checkout@v3

      - name: Fetch composer files
        continue-on-error: true
        run: |
          gh extension install mislav/gh-cp
          for F in composer.json composer.lock
          do
            gh cp "${{ github.repository_owner }}/${{ matrix.repository }}" "${F}" "${{ runner.temp }}" || {
              rm "${{ runner.temp }}/${F}"
            }
          done

      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: './tasks/autotag/requirements.txt'
      - run: pip install -r ./tasks/autotag/requirements.txt

      - name: Update labels
        working-directory: ./tasks/autotag
        run: |
          labels=`python parse-tags.py -r '${{ matrix.repository }}' -t 'tag-mapping.json' -c '${{ runner.temp }}/composer.json'`
          echo "Updating with labels: $labels"
          echo "$labels" | gh repo edit "${{ github.repository_owner }}/${{ matrix.repository }}" --add-topic
