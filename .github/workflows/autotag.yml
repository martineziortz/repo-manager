name: Automatically tag repositories
concurrency: autotag

env:
  GITHUB_TOKEN: ${{ secrets.REPO_PUSH_PAT }}
  TARGET_REPO_TAGS: debug,bank

on: workflow_dispatch

jobs:
  get-repos:
    name: Get the list of repos to update
    runs-on: ubuntu-latest
    outputs:
      repo-list: ${{ steps.set-repo-list.outputs.repo-list }}

    steps:
      - name: Get repostiory list
        id: set-repo-list
        run: |
          echo "::set-output name=repo-list::"$(gh search repos --topic="${TARGET_REPO_TAGS}" --owner='${{ github.repository_owner }}' --archived=0 -L 100 --json=name)

  autotag:
    name: Update target repos
    runs-on: ubuntu-latest
    needs: 
      - get-repos
    strategy:
      matrix: 
        include: ${{ fromJson(needs.get-repos.outputs.repo-list) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      - name: Fetch composer.json
        run: |
          gh api "repos/${{ github.repository_owner }}/${{ matrix.name }}/contents/composer.json" \
            -H 'Accept: application/vnd.github.VERSION.raw' \
            --jq '{name, description, keywords}' > "${{ runner.temp }}/composer.json"

      - name: dbg
        shell: python
        run: |
          import json

          f = open('tasks/autotag/tag-mapping.json')
          mapping_data = json.load(f)
          f.close()

          f = open('${{ runner.temp }}/composer.json')
          composer_data = json.load(f)
          f.close()

          labels = composer_data.get('keywords', [])

          repo_name = '${{ matrix.name }}'

          for tag, needles in mapping_data.items():
              if len(tag) == 0:
                  continue
              for needle in needles:
                  if len(needle) == 0:
                      continue

                  matches_repo = needle in repo_name
                  matches_composer_name = needle in composer_data.get('names', '')
                  matches_composer_desc = needle in composer_data.get('description', '')

                  if (matches_repo or matches_composer_name or matches_composer_desc):
                      labels.append(tag)

          labels = list(set(labels))
          labels.sort()
          print(labels)
