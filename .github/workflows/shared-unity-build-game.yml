name: Build game 😎

on:
  workflow_call:

jobs:
  meta-info:
    name: Get required meta info
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.set-sha.outputs.SHORT_SHA }}
      scripts: ${{ steps.build-scripts.outputs.SCRIPTS }}
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch version history
        run: git fetch --tags

      - name: Get build scripts
        id: build-scripts
        working-directory: ./Assets/Editor/
        run: |
          echo "SCRIPTS=$(basename -s .cs $(ls -1 Build*.cs) | jq -R | \
            jq -sMc 'map({"name": ., "device": (if endswith("Desktop") then "desktop" elif endswith("Mobile") then "mobile" else "general" end) })')" >> "$GITHUB_OUTPUT"

      - name: Make short commit SHA
        id: set-sha
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Generate next version
        id: version
        uses: bencatlab/autobashed-semver@v2.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          bump-tag: false
          file-update: false
          enable-snapshot: ${{ github.ref_name != 'main' }}
          snapshot-suffix: alpha

  build:
    name: ${{ matrix.script.name }} [${{ matrix.platform }}] ✨
    runs-on: ubuntu-latest
    needs:
      - meta-info
    strategy:
      matrix:
        platform: [ WebGL ]
        script: ${{ fromJson(needs.meta-info.outputs.scripts) }}
    env:
      BUILD_NAME: ${{ matrix.script.name }}--${{ matrix.script.device }}--${{ matrix.platform }}--${{ needs.meta-info.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache assets and packages
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build project
        uses: game-ci/unity-builder@v4
        id: unity-build
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          versioning: Custom
          version: ${{ needs.meta-info.outputs.semver }}
          targetPlatform: ${{ matrix.platform }}
          buildName: game
          buildMethod: ScriptedBuild.${{ matrix.script.name }}.BuildOptions

      - name: Archive build
        run: |
          tar -czvf "${{ env.BUILD_NAME }}--${{ steps.unity-build.outputs.buildVersion }}.tar.gz" -C "build/${{ matrix.platform }}/game" .

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.BUILD_NAME }}--${{ steps.unity-build.outputs.buildVersion }}"
          path: "${{ env.BUILD_NAME }}--${{ steps.unity-build.outputs.buildVersion }}.tar.gz"
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create new release
    runs-on: ubuntu-latest
    needs:
      - meta-info
      - build
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      release_url: ${{ steps.release.outputs.url }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: build/

      - name: Create release [${{ needs.meta-info.outputs.semver }}]
        id: release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_MANAGER_PAT }}
        with:
          tag_name: ${{ needs.meta-info.outputs.semver }}
          prerelease: ${{ github.ref_name != 'main' }}
          target_commitish: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: build/**/*.tar.gz

  deploy:
    name: Deploy release
    runs-on: ubuntu-latest
    if: ${{ vars.UNITY_DEPLOY_ENABLED == 'true' }}
    needs:
      - meta-info
      - release
    steps:
      - name: Deploy build
        uses: distributhor/workflow-webhook@v3
        env:
          webhook_url: ${{ vars.UNITY_DEPLOY_URL }}
          webhook_secret: ${{ secrets.UNITY_DEPLOY_SECRET }}
          data: '{ "release": "${{ needs.meta-info.outputs.semver }}", "release_id": ${{ needs.release.outputs.release_id }}, "release_url": "${{ needs.release.outputs.release_url }}" }'
          verbose: ${{ vars.UNITY_DEPLOY_VERBOSE }}
