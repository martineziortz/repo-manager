name: dbg

env:
  GITHUB_TOKEN: ${{ secrets.REPO_MANAGER_PAT }}

on: workflow_dispatch

jobs:
  get-repos:
    name: Get the list of repos to update
    uses: ./.github/workflows/get-repos.yml
    with:
      repository_owner: ${{ github.repository_owner }}
      topics: "laravel"
    secrets:
      access-token: ${{ secrets.REPO_MANAGER_PAT }}

  show_output:
    runs-on: ubuntu-latest
    needs:
      - get-repos
    steps:
      - run: echo ${{ needs.get-repos.outputs.repo-list }}
