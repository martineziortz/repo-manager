name: Create release pull request
concurrency:
  group: release-pr
  cancel-in-progress: true

on:
  workflow_call:

jobs:
  check_for_automation:
    name: Check if automated
    runs-on: ubuntu-latest
    outputs:
      automated_commit: ${{ steps.build_commit.outputs.skip == 'True' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if needs skip
        id: build_commit
        shell: python
        run: |
          import os

          is_automated_build = "${{ startsWith(github.event.head_commit.message, '[BUILD]') }}" == "true"
          is_triggered_by_github = "${{ endsWith(github.event.head_commit.author.username, '[bot]') }}" == "true"
          is_app_project = "${{ startsWith(github.repository, 'app-') }}" == "true"
          is_app_build = is_app_project and is_automated_build

          skip = (is_automated_build and is_triggered_by_github) and not is_app_build

          print(f"skip set to: {skip}")
          with open(os.environ.get("GITHUB_OUTPUT", ""), "a") as output_file:
            output_file.write(f"skip={skip}\n")

  create_pull_request:
    name: Create release PR
    runs-on: ubuntu-latest
    if: needs.check_for_automation.outputs.automated_commit == 'false'
    needs:
      - check_for_automation
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for existing pull request
        id: find-pull-request
        uses: juliangruber/find-pull-request-action@v1
        with:
          base: main
          branch: develop

      - name: Create pull request
        if: steps.find-pull-request.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create -B main -H develop --title '[BUILD] Merge develop to main' --body 'Automated release merge'
