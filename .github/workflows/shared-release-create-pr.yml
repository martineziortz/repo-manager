name: Create release pull request
concurrency:
  group: release-pr
  cancel-in-progress: true

on:
  workflow_call:

jobs:
  check_for_automation:
    name: Check if automated
    runs-on: ubuntu-latest
    outputs:
      automated_commit: ${{ steps.build_commit.outputs.skip == true }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if needs skip
        id: build_commit
        run: |
          ./.github/release-skip-check.sh '${{ github.repository }}' \
            '${{ github.event.head_commit.author.username }}' \
            '${{ github.event.head_commit.message }}'
          skip=$?
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip set to: $skip"

  create_pull_request:
    name: Create release PR
    runs-on: ubuntu-latest
    if: needs.check_for_automation.outputs.automated_commit == 'false'
    needs:
      - check_for_automation
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for existing pull request
        id: find-pull-request
        uses: juliangruber/find-pull-request-action@v1
        with:
          base: main
          branch: develop

      - name: Create pull request
        if: steps.find-pull-request.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create -B main -H develop --title '[BUILD] Merge develop to main' --body 'Automated release merge'
